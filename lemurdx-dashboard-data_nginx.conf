# Nginx configuration for LemurDX Dashboard Data Check
# Accessible at https://big1.lan.cmu.edu/lemurdx-dashboard-data

server {
    listen 443 ssl http2;
    server_name big1.lan.cmu.edu;

    # SSL configuration - adjust paths as needed
    # ssl_certificate /etc/letsencrypt/live/big1.lan.cmu.edu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/big1.lan.cmu.edu/privkey.pem;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logs
    access_log /var/log/nginx/lemurdx-dashboard-data_access.log;
    error_log /var/log/nginx/lemurdx-dashboard-data_error.log;

    # Increase timeouts for API requests
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Proxy /lemurdx-dashboard-data to Flask app
    location /lemurdx-dashboard-data {
        proxy_pass http://127.0.0.1:5008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /lemurdx-dashboard-data;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static files (if any)
    location /lemurdx-dashboard-data/static {
        alias /home/shreya/lemurdx-data-check/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# HTTP redirect to HTTPS (optional)
server {
    listen 80;
    server_name big1.lan.cmu.edu;

    location /lemurdx-dashboard-data {
        return 301 https://$server_name$request_uri;
    }
}

